
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>University | Admission Orbit</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- University Header -->
    <header class="hero">

        <div class="hero-inner">

            <a class="back-link" href="index.html" onclick="history.back(); return false;">
    &larr; Back to all universities
</a>

            <span id="uniType" class="badge"></span>

            <h1 id="uniName"></h1>

        </div>

    </header>


    <div class="container">

        <!-- Quick Facts -->
        <div id="stats" class="stats"></div>


        <div class="main">

            <!-- University Details -->
            <div class="details">

                <div id="info" class="card-box"></div>

            </div>


            <!-- Eligibility Checker -->
            <aside class="eligibility card-box">

                <h3>Check Your Eligibility</h3>

                <p class="hint">
                    Enter your results to see which units you can apply to.
                </p>


                <!-- SSC GPA -->
                <div class="field">

                    <label for="ssc">SSC GPA</label>

                    <input
                        type="text"
                        id="ssc"
                        placeholder="5.00"
                        min="0"
                        max="5"
                        step="0.01"
                    >

                </div>


                <!-- HSC GPA -->
                <div class="field">

                    <label for="hsc">HSC GPA</label>

                    <input
                        type="text"
                        id="hsc"
                        placeholder="5.00"
                        min="0"
                        max="5"
                        step="0.01"
                    >

                </div>


                <!-- Student Group -->
                <div class="field">

                    <label for="group">Group</label>

                    <select id="group">

                        <option value="">Select group</option>

                        <option value="Science">Science</option>

                        <option value="Business">Business Studies</option>

                        <option value="Humanities">Humanities / Arts</option>

                    </select>

                </div>


                <!-- Check Button -->
                <button class="primary" onclick="checkEligibility()">
                    Check Eligibility
                </button>


                <!-- Eligibility Result -->
                <div id="result"></div>

            </aside>

        </div>

    </div>


    <!-- Footer -->
    <footer class="footer">

        Admission Orbit - always confirm details on the official
        university website before applying.

    </footer>


    <!-- JavaScript Files -->
    <script src="data.js"></script>
    <script src="university.js"></script>

</body>

</html>
